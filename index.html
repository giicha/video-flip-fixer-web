<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lossless Video Rotator (Web App)</title>
    
<!-- Подключаем сам FFmpeg (UMD версию) -->
<script src="https://unpkg.com"></script>
<!-- Подключаем утилиты, необходимые для работы fetchFile -->
<script src="https://unpkg.com"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #333; margin-top: 0; font-size: 24px; }
        p { color: #666; font-size: 14px; }
        
        #drop-zone {
            border: 2px dashed #4CAF50;
            border-radius: 10px;
            padding: 40px 20px;
            background-color: #fafdfb;
            cursor: pointer;
            transition: background 0.3s;
            margin: 20px 0;
        }
        #drop-zone.hover { background-color: #e8f5e9; }
        #drop-zone p { font-size: 16px; color: #2e7d32; margin: 0; font-weight: bold; }
        
        #file-input { display: none; }
        
        #status {
            font-weight: bold;
            color: #ff9800;
            margin: 15px 0;
        }
        #log-box {
            width: 100%;
            height: 160px;
            background: #272822;
            color: #f8f8f2;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lossless Video Rotator Fixer</h1>
    <p>Мгновенный сброс флага поворота в видео без потери качества. Всё обрабатывается прямо в браузере локально!</p>
    
    <div id="drop-zone">
        <p id="drop-text">Перетащите сюда видео (.mp4, .mov) или кликните для выбора</p>
        <input type="file" id="file-input" accept="video/mp4,video/quicktime" multiple>
    </div>

    <div id="status">Инициализация веб-модулей...</div>
    <div id="log-box"></div>
</div>

<script>
    // Жесткая глобальная блокировка стандартного открытия файлов браузером (РАБОТАЕТ СРАЗУ)
    window.addEventListener('dragover', (e) => e.preventDefault(), false);
    window.addEventListener('drop', (e) => e.preventDefault(), false);

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const statusDiv = document.getElementById('status');
    const logBox = document.getElementById('log-box');

    let ffmpeg = null;
    let isReady = false; // Флаг готовности интерфейса

    function log(message) {
        const line = document.createElement('div');
        line.textContent = `> ${message}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
    }

     // Инициализация новой архитектуры FFmpeg 0.12.x
    async function initFFmpeg() {
        try {
            const { FFmpeg } = window.FFmpeg;
            ffmpeg = new FFmpeg();
            
            ffmpeg.on('log', ({ message }) => {
                if (message.includes('display_rotation') || message.includes('video:')) {
                    log(message);
                }
            });

            statusDiv.textContent = "Загрузка ядра WebAssembly...";
            
            // Используем стабильное и проверенное зеркало unpkg с указанием точной версии (0.12.6)
            const baseURL = 'https://unpkg.com';
            
            await ffmpeg.load({
                coreURL: `${baseURL}/ffmpeg-core.js`,
                wasmURL: `${baseURL}/ffmpeg-core.wasm`
            });

            statusDiv.textContent = "Готов к работе! Закиньте файл.";
            statusDiv.style.color = "#4CAF50";
            log("Система успешно запущена и готова к пакетной обработке.");
            
            isReady = true;
        } catch (error) {
            statusDiv.textContent = "Критическая ошибка запуска ядра.";
            statusDiv.style.color = "#f44336";
            log("Ошибка загрузки: " + error);
            console.error(error); // Выводим детальную ошибку в консоль браузера
        }
    }


    // НАВЕШИВАЕМ СОБЫТИЯ СРАЗУ, ПРИ ОТКРЫТИИ СТРАНИЦЫ
    dropZone.addEventListener('click', () => {
        if (!isReady) return alert("Пожалуйста, подождите окончания загрузки ядра WebAssembly.");
        fileInput.click();
    });

    dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('hover'); });
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('hover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('hover'));
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation(); // Жестко блокируем открытие файла браузером
        dropZone.classList.remove('hover');
        
        if (!isReady) {
            alert("Ядро еще загружается. Пожалуйста, подождите.");
            return;
        }

        if (e.dataTransfer && e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFiles(e.target.files);
        }
    });

    // Запуск процесса обработки
    async function handleFiles(files) {
        if (!ffmpeg) return;

        statusDiv.textContent = "Обработка файлов...";
        statusDiv.style.color = "#ff9800";

        const { fetchFile } = window.FFmpegUtil;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            log(`Анализ видео: ${file.name}`);

            await ffmpeg.writeFile(file.name, await fetchFile(file));

            const outName = `fixed_${file.name}`;
            log(`Обнуление флагов во всех скрытых видео-стримах...`);

            await ffmpeg.exec(['-y', '-display_rotation', '0', '-i', file.name, '-c', 'copy', '-map_metadata', '0', outName]);

            log(`Сброс завершен. Формирование ссылки...`);

            const data = await ffmpeg.readFile(outName);
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = outName;
            document.body.appendChild(a);
            a.click();
            
            await ffmpeg.deleteFile(file.name);
            await ffmpeg.deleteFile(outName);
            URL.revokeObjectURL(url);
            a.remove();
            
            log(`Файл ${outName} успешно сохранен.`);
        }

        statusDiv.textContent = "Все файлы успешно исправлены!";
        statusDiv.style.color = "#4CAF50";
    }

    // Запуск при открытии страницы
    initFFmpeg();
</script>


</body>
</html>
